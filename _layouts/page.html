---
layout: default
---
<main id="content" class="wrap layout">
  <article class="post page">
    {% if page.eyebrow %}<div class="meta"><span>{{ page.eyebrow }}</span></div>{% endif %}
    <h1 class="post-title">{{ page.heading | default: page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    <div class="prose">
      {{ content }}
    </div>
  </article>
  {% include sidebar.html %}
</main>
